<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лог запросов</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }
    #logs {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .entry {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .entry:last-child {
      border-bottom: none;
    }
    .header {
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .param {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      padding: 2px 0 2px 16px;
    }
    .key {
      color: #0066cc;
      font-weight: 600;
    }
    .empty {
      font-style: italic;
      color: #999;
      padding-left: 16px;
    }
    .controls {
      max-width: 720px;
      margin: 12px auto 0;
      text-align: right;
    }
    #clearBtn {
      font: inherit;
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    #clearBtn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div id="logs"><div class="empty">Загрузка...</div></div>
  <div class="controls">
    <button id="clearBtn">Очистить лог</button>
  </div>
  <script>
    const logsEl = document.getElementById('logs');
    const MAX_ENTRIES = 100;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&',
        '<': '<',
        '>': '>',
        '"': '"',
        "'": '&#39;'
      }[c]));
    }

    function entryToHtml(entry) {
      const params = entry.params || {};
      const keys = Object.keys(params);
      let html = '<div class="entry">';
      html += `<div class="header">${escapeHtml(entry.dateTime)} (IP: ${escapeHtml(entry.ip)})</div>`;
      if (keys.length === 0) {
        html += '<div class="empty">(без параметров)</div>';
      } else {
        for (const key of keys) {
          html += `<div class="param"><span class="key">${escapeHtml(key)}</span>: ${escapeHtml(params[key])}</div>`;
        }
      }
      html += '</div>';
      return html;
    }

    function showNoLogs() {
      logsEl.innerHTML = '<div class="empty">Логов пока нет.<br>Для добавления сделайте запрос: GET /log с любыми параметрами</div>';
    }

    function showCleared() {
      logsEl.innerHTML = '<div class="empty">Лог очищен</div>';
    }

    function clearLogs() {
      showCleared();
    }

    function appendEntry(entry) {
      const clearedMsg = logsEl.querySelector('.empty');
      if (clearedMsg && logsEl.children.length === 1) {
        clearedMsg.remove();
      }
      logsEl.insertAdjacentHTML('beforeend', entryToHtml(entry));
      while (logsEl.children.length > MAX_ENTRIES) {
        logsEl.removeChild(logsEl.firstChild);
      }
      logsEl.scrollTop = logsEl.scrollHeight;
    }

    // Загружаем последние 100 записей
    fetch('/api/logs')
      .then((r) => r.json())
      .then((entries) => {
        if (entries.length === 0) {
          showNoLogs();
        } else {
          logsEl.innerHTML = entries.map(entryToHtml).join('');
          logsEl.scrollTop = logsEl.scrollHeight;
        }
      })
      .catch(() => {
        logsEl.innerHTML = '<div class="empty">Не удалось загрузить лог</div>';
      });

    // Кнопка очистки лога
    document.getElementById('clearBtn').addEventListener('click', () => {
      fetch('/clear').catch(() => {});
    });

    // WebSocket — новые записи и события в реальном времени
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'clear') {
          clearLogs();
        } else {
          appendEntry(data);
        }
      } catch (err) {
        // игнорируем некорректные сообщения
      }
    };
  </script>
</body>
</html>
