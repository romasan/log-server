<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лог запросов</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      background: #f5f5f5;
      color: #333;
    }
    .filter {
      max-width: 720px;
      margin: 0 auto 12px;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 12px 16px;
      display: flex;
      gap: 10px;
      align-items: center;
    }
    #filterMode {
      font: inherit;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    #filterInput {
      flex: 1;
      font: inherit;
      padding: 6px 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
    }
    #filterMode:focus,
    #filterInput:focus {
      outline: none;
      border-color: #0066cc;
    }
    #logs {
      max-width: 720px;
      margin: 0 auto;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 8px;
      padding: 16px;
      max-height: 80vh;
      overflow-y: auto;
    }
    .entry {
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }
    .entry:last-child {
      border-bottom: none;
    }
    .header {
      font-weight: 600;
      color: #555;
      margin-bottom: 4px;
    }
    .param {
      font-family: "SF Mono", Menlo, Consolas, monospace;
      font-size: 14px;
      padding: 2px 0 2px 16px;
    }
    .key {
      color: #0066cc;
      font-weight: 600;
    }
    .empty {
      font-style: italic;
      color: #999;
      padding-left: 16px;
    }
    .controls {
      max-width: 720px;
      margin: 12px auto 0;
      text-align: right;
    }
    #clearBtn {
      font: inherit;
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      color: #333;
      cursor: pointer;
    }
    #clearBtn:hover {
      background: #f0f0f0;
    }
  </style>
</head>
<body>
  <div class="filter">
    <select id="filterMode">
      <option value="ip">по ip</option>
      <option value="param">по параметру</option>
    </select>
    <input type="text" id="filterInput" placeholder="Фильтр по выбранному полю...">
  </div>
  <div id="logs"><div class="empty">Загрузка...</div></div>
  <div class="controls">
    <button id="clearBtn">Очистить лог</button>
  </div>
  <script>
    const logsEl = document.getElementById('logs');
    const filterModeEl = document.getElementById('filterMode');
    const filterInputEl = document.getElementById('filterInput');
    const MAX_ENTRIES = 100;

    let entries = [];
    let isCleared = false;
    let filterMode = filterModeEl.value;
    let filterText = '';
    let filterTimeout = null;

    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, (c) => ({
        '&': '&',
        '<': '<',
        '>': '>',
        '"': '"',
        "'": '&#39;'
      }[c]));
    }

    function entryToHtml(entry) {
      const params = entry.params || {};
      const keys = Object.keys(params);
      let html = '<div class="entry">';
      html += `<div class="header">${escapeHtml(entry.dateTime)} (IP: ${escapeHtml(entry.ip)})</div>`;
      if (keys.length === 0) {
        html += '<div class="empty">(без параметров)</div>';
      } else {
        for (const key of keys) {
          html += `<div class="param"><span class="key">${escapeHtml(key)}</span>: ${escapeHtml(params[key])}</div>`;
        }
      }
      html += '</div>';
      return html;
    }

    function matchesFilter(entry) {
      const text = filterText.trim().toLowerCase();
      if (!text) return true;
      if (filterMode === 'param') {
        return Object.keys(entry.params || {}).some((key) => key.toLowerCase().includes(text));
      }
      return String(entry.ip || '').toLowerCase().includes(text);
    }

    function render(scrollToBottom) {
      if (entries.length === 0) {
        if (isCleared) {
          logsEl.innerHTML = '<div class="empty">Лог очищен</div>';
        } else {
          logsEl.innerHTML = '<div class="empty">Логов пока нет.<br>Для добавления сделайте запрос: GET /log с любыми параметрами</div>';
        }
        return;
      }
      const filtered = entries.filter(matchesFilter);
      if (filtered.length === 0) {
        logsEl.innerHTML = '<div class="empty">Ничего не найдено</div>';
        return;
      }
      logsEl.innerHTML = filtered.map(entryToHtml).join('');
      if (scrollToBottom) {
        logsEl.scrollTop = logsEl.scrollHeight;
      }
    }

    function showCleared() {
      entries = [];
      isCleared = true;
      render(false);
    }

    function clearLogs() {
      showCleared();
    }

    function appendEntry(entry) {
      isCleared = false;
      entries.push(entry);
      if (entries.length > MAX_ENTRIES) {
        entries.shift();
      }
      render(true);
    }

    // Фильтрация с дебаунсом
    function applyFilter() {
      clearTimeout(filterTimeout);
      filterTimeout = setTimeout(() => {
        filterMode = filterModeEl.value;
        filterText = filterInputEl.value;
        render(false);
      }, 200);
    }

    filterModeEl.addEventListener('change', applyFilter);
    filterInputEl.addEventListener('input', applyFilter);

    // Загружаем последние 100 записей
    fetch('/api/logs')
      .then((r) => r.json())
      .then((data) => {
        entries = data.slice(0, MAX_ENTRIES);
        render(true);
      })
      .catch(() => {
        logsEl.innerHTML = '<div class="empty">Не удалось загрузить лог</div>';
      });

    // Кнопка очистки лога
    document.getElementById('clearBtn').addEventListener('click', () => {
      fetch('/clear').catch(() => {});
    });

    // WebSocket — новые записи и события в реальном времени
    const proto = location.protocol === 'https:' ? 'wss' : 'ws';
    const ws = new WebSocket(`${proto}://${location.host}`);
    ws.onmessage = (e) => {
      try {
        const data = JSON.parse(e.data);
        if (data.type === 'clear') {
          clearLogs();
        } else {
          appendEntry(data);
        }
      } catch (err) {
        // игнорируем некорректные сообщения
      }
    };
  </script>
</body>
</html>
